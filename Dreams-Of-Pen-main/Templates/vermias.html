<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <title>Mis Reseñas - Dreams of Pen</title>
</head>

<body>
    <div class="mis-resenas-container">
        <div class="mis-resenas-header">
            <img src="{{ url_for('static', filename='imagenes/bin.png') }}" alt="Dreams of Pen" onclick="window.history.back()" style="cursor: pointer;">
            <h1 class="barraDeBusqueda">Mis reseñas</h1>
        </div>

        <div class="resenas-grid">
            {% for r in reviews %}
            <div class="resena-card">
                {% if r.imagen %}
                <img src="{{ url_for('static', filename='uploads/' + r.imagen) }}" class="resena-image" alt="{{ r.modelo }}">
                {% endif %}
                
                <div class="resena-header">
                    <a>{{ r.modelo }} ({{ r.marca }})</a>
                </div>
                <div class="resena-body">
                    <p>{{ r.texto }}</p>
                </div>
                <div class="resena-footer">
                    <div class="rating-display">
                        {% for i in range(1, 6) %}
                        <div class="pen-cap {% if i <= r.puntuacion %}filled{% else %}empty{% endif %}">
                            <svg width="28" height="28" viewBox="0 0 40 120" xmlns="http://www.w3.org/2000/svg">
                                <rect x="8" y="10" width="24" height="90" rx="3" fill="{% if i <= r.puntuacion %}#C85A54{% else %}#999{% endif %}"/>
                                <ellipse cx="20" cy="10" rx="12" ry="8" fill="{% if i <= r.puntuacion %}#C85A54{% else %}#999{% endif %}"/>
                                <path d="M 32 25 Q 38 30 38 40 Q 38 50 32 55 L 32 25" fill="{% if i <= r.puntuacion %}#C85A54{% else %}#999{% endif %}" opacity="0.3"/>
                                <ellipse cx="20" cy="100" rx="12" ry="6" fill="{% if i <= r.puntuacion %}#C85A54{% else %}#999{% endif %}" opacity="0.8"/>
                                <line x1="8" y1="95" x2="32" y2="95" stroke="white" stroke-width="1" opacity="0.3"/>
                            </svg>
                        </div>
                        {% endfor %}
                    </div>
                    <a>{{ session.usuario }}</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
